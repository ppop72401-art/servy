<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار السيرفر</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 30px; background: #222; color: #fff; }
        button { padding: 15px 30px; margin: 10px; font-size: 18px; cursor: pointer; background: #58cc02; border: none; border-radius: 10px; color: white; font-weight: bold; }
        #log { margin-top: 20px; padding: 10px; background: #333; height: 300px; overflow-y: auto; text-align: right; border-radius: 10px; border: 2px solid #555; }
        .log-entry { margin-bottom: 5px; border-bottom: 1px solid #444; padding-bottom: 5px; }
    </style>
</head>
<body>
    <h1 style="color: #1cb0f6;">اختبار الاتصال 🟢</h1>
    <button onclick="connect()">1. اتصل بالسيرفر</button>
    <button onclick="sendMessage()" style="background: #ff4b4b;">2. إرسال رسالة</button>
    
    <div id="log"></div>

    <script>
        let ws;
        const logDiv = document.getElementById('log');

        function log(msg) {
            logDiv.innerHTML += `<div class="log-entry">${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight; // التمرير التلقائي للأسفل
        }

        function connect() {
            // الاتصال بـ WebSocket بناءً على الـ IP الحالي في المتصفح
            const wsUrl = `ws://${location.host}/ws`;
            log(`جاري الاتصال بـ ${wsUrl}...`);
            
            ws = new WebSocket(wsUrl);

            ws.onopen = () => log("✅ <b>تم الاتصال بنجاح!</b>");
            ws.onmessage = (e) => log("📥 <b>استلام من السيرفر:</b> " + e.data);
            ws.onerror = (e) => log("❌ خطأ في الاتصال.");
            ws.onclose = () => log("🔌 تم قطع الاتصال.");
        }

        function sendMessage() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const msg = `رسالة تجريبية في ${new Date().toLocaleTimeString()}`;
                ws.send(msg);
                log("📤 <b>أنت أرسلت:</b> " + msg);
            } else {
                log("⚠️ الرجاء الضغط على 'اتصل بالسيرفر' أولاً.");
            }
        }
    </script>
</body>
</html>
