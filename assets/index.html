<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNO No Mercy - Ultimate</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #111b21; --surface: #1f2c34;
            --primary: #58cc02; --primary-shadow: #46a302;
            --red: #ff4b4b; --red-shadow: #cb3232;
            --blue: #1cb0f6; --blue-shadow: #1899d6;
            --yellow: #ffc800; --yellow-shadow: #cca000;
            --black: #2b333a; --black-shadow: #1d2328;
            --font: 'Tajawal', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font); user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-dark); color: white; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

        .btn-duo {
            background: var(--primary); color: white; font-size: 1.2rem; font-weight: 900;
            padding: 15px 30px; border-radius: 16px; border: none;
            border-bottom: 5px solid var(--primary-shadow); cursor: pointer;
            transition: transform 0.1s, border-width 0.1s; width: 100%; margin-bottom: 15px;
        }
        .btn-duo:active { transform: translateY(5px); border-bottom-width: 0; margin-bottom: 20px; }
        .btn-duo.blue { background: var(--blue); border-bottom-color: var(--blue-shadow); }
        .btn-duo.red { background: var(--red); border-bottom-color: var(--red-shadow); }

        input {
            width: 100%; padding: 15px; border-radius: 16px; font-size: 1.2rem; font-weight: bold;
            border: 2px solid var(--surface); background: white; color: black; margin-bottom: 20px; text-align: center;
        }

        .screen { display: none; flex-direction: column; height: 100%; width: 100%; position: absolute; top: 0; left: 0; }
        .screen.active { display: flex; }
        
        .center-box { margin: auto; background: var(--surface); padding: 30px; border-radius: 24px; border-bottom: 8px solid var(--black-shadow); width: 90%; max-width: 400px; text-align: center; }

        .card {
            width: 70px; height: 105px; border-radius: 12px; display: flex; flex-direction: column; justify-content: space-between; padding: 5px;
            font-size: 1.8rem; font-weight: 900; border-bottom: 5px solid; cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); position: relative; box-shadow: 0 5px 10px rgba(0,0,0,0.4);
        }
        .card::after { content: ''; position: absolute; top:3px; left:3px; right:3px; bottom:3px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.2); pointer-events: none; }
        .card:hover { transform: translateY(-15px); z-index: 10; }
        .card.disabled { filter: brightness(0.5); cursor: not-allowed; transform: none !important; }
        
        .card.red { background: var(--red); border-bottom-color: var(--red-shadow); color: white; }
        .card.blue { background: var(--blue); border-bottom-color: var(--blue-shadow); color: white; }
        .card.green { background: var(--primary); border-bottom-color: var(--primary-shadow); color: white; }
        .card.yellow { background: var(--yellow); border-bottom-color: var(--yellow-shadow); color: black; }
        .card.yellow::after { border-color: rgba(0,0,0,0.2); }
        .card.black { background: var(--black); border-bottom-color: var(--black-shadow); color: white; }

        .c-val { text-align: center; align-self: center; text-shadow: 1px 1px 0 rgba(0,0,0,0.3); }
        .card.yellow .c-val { text-shadow: none; }
        .c-val.sm { font-size: 1rem; }

        .hud { display: flex; justify-content: space-between; padding: 15px; background: var(--surface); border-bottom: 3px solid var(--black); font-weight: bold; font-size: 1.1rem; }
        .opponents-ring { display: flex; justify-content: center; gap: 15px; padding: 15px; overflow-x: auto; }
        .opp-avatar { background: var(--black); padding: 10px 15px; border-radius: 16px; border-bottom: 4px solid var(--black-shadow); text-align: center; font-weight: bold; transition: 0.3s; }
        .opp-avatar.active { background: var(--surface); border-color: var(--yellow); box-shadow: 0 0 15px rgba(255,200,0,0.5); }
        .opp-avatar.danger { background: var(--red); border-color: var(--red-shadow); animation: pulse 0.5s infinite alternate; }

        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }

        .table-area { flex: 1; display: flex; justify-content: center; align-items: center; gap: 20px; position: relative; }
        .hand-container { height: 130px; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 20px; overflow-x: auto; }
        .hand-container .card { margin: 0 -12px; }

        #uno-btn { position: absolute; left: 20px; bottom: 20px; width: 70px; height: 70px; border-radius: 50%; background: var(--red); border: none; border-bottom: 5px solid var(--red-shadow); color: white; font-weight: 900; font-size: 1.2rem; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5); z-index: 100; transition: 0.1s; }
        #uno-btn:active { transform: translateY(5px); border-bottom-width: 0; }

        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); z-index: 900; display: none; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .color-btn { width: 80px; height: 80px; border-radius: 20px; cursor: pointer; border-bottom: 6px solid rgba(0,0,0,0.3); }

        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--surface); border-bottom: 4px solid var(--black); padding: 15px 25px; border-radius: 20px; font-weight: bold; font-size: 1.1rem; z-index: 1000; display: none; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div id="toast">رسالة النظام</div>

    <!-- شاشة الدخول -->
    <div id="screen-login" class="screen active">
        <div class="center-box">
            <h1 style="font-size: 4rem; color: var(--red); margin-bottom: -10px; text-shadow: 0 5px 0 var(--red-shadow);">UNO</h1>
            <h2 style="color: var(--yellow); margin-bottom: 30px; font-weight: 900; letter-spacing: 2px;">NO MERCY</h2>
            <input type="text" id="playerName" placeholder="اكتب اسمك للعب..." maxlength="10">
            <button class="btn-duo" onclick="initNetwork(true)">إنشاء روم (أنا الحكم)</button>
            <button class="btn-duo blue" onclick="initNetwork(false)">انضمام لروم</button>
        </div>
    </div>

    <!-- شاشة الانتظار -->
    <div id="screen-lobby" class="screen">
        <div class="center-box">
            <h2 style="margin-bottom: 20px; color: var(--blue);">غرفة الانتظار</h2>
            <div id="lobby-players" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;"></div>
            <button id="btn-start-game" class="btn-duo red" style="display: none;" onclick="startGame()">بدء اللعبة 🔥</button>
            <p id="wait-msg" style="color: gray; font-weight: bold;">بانتظار بدء المضيف للعبة...</p>
        </div>
    </div>

    <!-- شاشة اللعب -->
    <div id="screen-game" class="screen">
        <div class="hud">
            <span id="hud-turn" style="color: var(--primary);"></span>
            <span id="hud-stack" style="color: var(--red);"></span>
        </div>
        
        <div class="opponents-ring" id="opponents-ring"></div>

        <div class="table-area">
            <div class="card black" onclick="drawCard()" style="border: 2px solid white;">
                <div class="c-val sm">اسحب</div>
            </div>
            <div class="card" id="top-card" style="box-shadow: 0 10px 25px rgba(0,0,0,0.8); margin: 0 20px; transform: scale(1.1);"></div>
            <button id="uno-btn" onclick="callUno()">UNO!</button>
        </div>

        <div class="hand-container" id="my-hand"></div>
    </div>

    <!-- الموديلات -->
    <div class="modal" id="modal-color">
        <div class="center-box">
            <h2>اختر لوناً</h2>
            <div class="color-grid">
                <div class="color-btn" style="background: var(--red);" onclick="resolveColor('red')"></div>
                <div class="color-btn" style="background: var(--blue);" onclick="resolveColor('blue')"></div>
                <div class="color-btn" style="background: var(--primary);" onclick="resolveColor('green')"></div>
                <div class="color-btn" style="background: var(--yellow);" onclick="resolveColor('yellow')"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="modal-player-select">
        <div class="center-box">
            <h2 style="color: var(--yellow); margin-bottom: 15px;">بادل أوراقك! (قانون 7)</h2>
            <div id="player-select-list"></div>
        </div>
    </div>

    <script>
        let ws;
        let myId = Math.random().toString(36).substr(2, 9);
        let myName = "";
        let isHost = false;
        let pendingCardPlay = null; 
        
        let gameState = {
            status: 'waiting', players: [], deck: [], discardPile: [], 
            turnIdx: 0, direction: 1, stackAmount: 0, activeColor: ''
        };

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function showToast(msg, duration = 3000) {
            let t = document.getElementById('toast');
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', duration);
        }

        function initNetwork(asHost) {
            let nameInput = document.getElementById('playerName').value.trim();
            if(!nameInput) return showToast("أدخل اسمك أولاً!");
            
            myName = nameInput;
            isHost = asHost;
            
            if(isHost) {
                document.getElementById('btn-start-game').style.display = 'block';
                document.getElementById('wait-msg').style.display = 'none';
                gameState.players.push({ id: myId, name: myName, hand: [], eliminated: false, calledUno: false });
            }

            ws = new WebSocket(`ws://${location.host}/ws`);
            
            ws.onopen = () => {
                switchScreen('screen-lobby');
                ws.send(JSON.stringify({ type: 'join', id: myId, name: myName }));
                if(isHost) renderLobby();
            };

            ws.onmessage = (event) => {
                let data = JSON.parse(event.data);
                
                if (isHost && data.type === 'join' && data.id !== myId) {
                    gameState.players.push({ id: data.id, name: data.name, hand: [], eliminated: false, calledUno: false });
                    broadcastState();
                } else if (isHost && data.type === 'action') {
                    processAction(data.actionData);
                } else if (data.type === 'state_update') {
                    gameState = data.state;
                    if(gameState.status === 'waiting') renderLobby();
                    else if (gameState.status === 'playing') renderGame();
                    else if (gameState.status === 'finished') showToast("🎉 انتهت اللعبة!", 10000);
                }
            };
        }

        function broadcastState() {
            if(!isHost) return;
            ws.send(JSON.stringify({ type: 'state_update', state: gameState }));
            if(gameState.status === 'waiting') renderLobby();
            else renderGame();
        }

        function renderLobby() {
            let html = '';
            gameState.players.forEach(p => {
                html += `<div style="background: var(--black); padding: 10px; border-radius: 12px;">👤 ${p.name}</div>`;
            });
            document.getElementById('lobby-players').innerHTML = html;
        }

        function startGame() {
            if(gameState.players.length < 2) return showToast("تحتاج للاعبين على الأقل!");
            
            gameState.deck = generateDeck();
            gameState.players.forEach(p => { p.hand = []; for(let i=0; i<7; i++) p.hand.push(gameState.deck.pop()); });

            let firstCard;
            do {
                firstCard = gameState.deck.pop();
                if(isNaN(firstCard.val)) gameState.deck.unshift(firstCard);
            } while (isNaN(firstCard.val));

            gameState.discardPile = [firstCard];
            gameState.activeColor = firstCard.color;
            gameState.status = 'playing';
            gameState.turnIdx = 0;
            broadcastState();
        }

        function generateDeck() {
            let d = []; const colors = ['red', 'blue', 'green', 'yellow']; let idC = 0;
            colors.forEach(c => {
                for(let i=1; i<=9; i++) { for(let j=0; j<3; j++) d.push({id: idC++, color: c, val: i.toString(), draw: 0}); }
                d.push({id: idC++, color: c, val: '0', draw:0}); d.push({id: idC++, color: c, val: '0', draw:0});
                d.push({id: idC++, color: c, val: '7', draw:0}); d.push({id: idC++, color: c, val: '7', draw:0});
                for(let j=0; j<3; j++) { d.push({id: idC++, color: c, val: 'Skip', draw:0}); d.push({id: idC++, color: c, val: 'Rev', draw:0}); d.push({id: idC++, color: c, val: '+2', draw:2}); }
                d.push({id: idC++, color: c, val: '+4', draw:4}); d.push({id: idC++, color: c, val: '+4', draw:4});
            });
            for(let i=0; i<6; i++) {
                d.push({id: idC++, color: 'black', val: 'W', draw:0});
                d.push({id: idC++, color: 'black', val: 'W+6', draw:6});
                d.push({id: idC++, color: 'black', val: 'W+10', draw:10});
            }
            return d.sort(() => Math.random() - 0.5);
        }

        function processAction(act) {
            let activeP = gameState.players[gameState.turnIdx];
            if(act.playerId !== activeP.id) return;

            if(act.type === 'play_card') {
                let p = gameState.players.find(pl => pl.id === act.playerId);
                let cIdx = p.hand.findIndex(c => c.id === act.cardId);
                let card = p.hand[cIdx];

                if(gameState.stackAmount > 0 && card.draw < gameState.discardPile[gameState.discardPile.length-1].draw) return; 
                if(card.color !== 'black' && card.color !== gameState.activeColor && card.val !== gameState.discardPile[gameState.discardPile.length-1].val) return;

                p.hand.splice(cIdx, 1);
                gameState.discardPile.push(card);
                
                if(card.color !== 'black') gameState.activeColor = card.color;
                else if(act.selectedColor) gameState.activeColor = act.selectedColor; 
                
                if(card.draw > 0) gameState.stackAmount += card.draw;
                
                let skips = 1;
                if(card.val === 'Rev') gameState.direction *= -1;
                if(card.val === 'Skip' || (card.val === 'Rev' && gameState.players.filter(pl=>!pl.eliminated).length === 2)) skips = 2;

                if(card.val === '0') passHands();
                if(card.val === '7' && act.targetId) swapHands(act.playerId, act.targetId);

                if(p.hand.length === 0) { gameState.status = 'finished'; broadcastState(); return; }

                advanceTurn(skips);
            } 
            else if (act.type === 'draw_card') {
                let p = gameState.players.find(pl => pl.id === act.playerId);
                let drawCount = gameState.stackAmount > 0 ? gameState.stackAmount : 1;
                
                for(let i=0; i<drawCount; i++) {
                    p.hand.push(gameState.deck.pop());
                    if(p.hand.length >= 25) { p.eliminated = true; break; } 
                }
                gameState.stackAmount = 0;
                
                if(gameState.players.filter(pl=>!pl.eliminated).length <= 1) { gameState.status = 'finished'; broadcastState(); return; }
                advanceTurn(1);
            }
            broadcastState();
        }

        function advanceTurn(steps) {
            do {
                gameState.turnIdx = (gameState.turnIdx + (gameState.direction * steps) + gameState.players.length) % gameState.players.length;
                steps = 1;
            } while (gameState.players[gameState.turnIdx].eliminated);
        }

        function passHands() {
            let active = gameState.players.filter(p => !p.eliminated);
            if(gameState.direction === 1) {
                let temp = [...active[0].hand];
                for(let i=0; i<active.length-1; i++) active[i].hand = [...active[i+1].hand];
                active[active.length-1].hand = temp;
            } else {
                let temp = [...active[active.length-1].hand];
                for(let i=active.length-1; i>0; i--) active[i].hand = [...active[i-1].hand];
                active[0].hand = temp;
            }
        }

        function swapHands(id1, id2) {
            let p1 = gameState.players.find(p=>p.id === id1);
            let p2 = gameState.players.find(p=>p.id === id2);
            let temp = [...p1.hand]; p1.hand = [...p2.hand]; p2.hand = temp;
        }

        function sendAction(data) {
            if(isHost) processAction(data);
            else ws.send(JSON.stringify({ type: 'action', actionData: data }));
        }

        function renderGame() {
            switchScreen('screen-game');
            let me = gameState.players.find(p => p.id === myId);
            let activePlayer = gameState.players[gameState.turnIdx];
            let isMyTurn = (activePlayer.id === myId);

            document.getElementById('hud-turn').innerText = `الدور: ${activePlayer.name}`;
            document.getElementById('hud-stack').innerText = gameState.stackAmount > 0 ? `تراكم السحب: +${gameState.stackAmount}` : '';

            let oppHtml = '';
            gameState.players.forEach(p => {
                if(p.id !== myId && !p.eliminated) {
                    let classes = 'opp-avatar';
                    if(p.id === activePlayer.id) classes += ' active';
                    if(p.hand.length >= 20) classes += ' danger';
                    oppHtml += `<div class="${classes}">${p.name}<br><span style="font-size:0.9rem">${p.hand.length} أوراق</span></div>`;
                }
            });
            document.getElementById('opponents-ring').innerHTML = oppHtml;

            let topCard = gameState.discardPile[gameState.discardPile.length - 1];
            let tcColor = topCard.color === 'black' ? gameState.activeColor : topCard.color;
            let tcClass = tcColor; 
            document.getElementById('top-card').className = `card ${tcClass}`;
            document.getElementById('top-card').innerHTML = `<div class="c-val ${topCard.val.length > 2 ? 'sm':''}">${topCard.val}</div>`;

            let handHtml = '';
            if(me.eliminated) {
                handHtml = `<h2 style="color:var(--red); text-shadow:0 0 10px red;">💀 تم طردك (تجاوزت 25 ورقة)</h2>`;
            } else {
                me.hand.forEach((c, idx) => {
                    let playable = isMyTurn;
                    let classes = `card ${c.color} ${playable ? '' : 'disabled'}`;
                    handHtml += `<div class="${classes}" style="z-index:${idx}" onclick="handleCardClick(${c.id}, '${c.color}', '${c.val}')"><div class="c-val ${c.val.length > 2 ? 'sm':''}">${c.val}</div></div>`;
                });
            }
            document.getElementById('my-hand').innerHTML = handHtml;
        }

        function handleCardClick(id, color, val) {
            let isMyTurn = (gameState.players[gameState.turnIdx].id === myId);
            if(!isMyTurn) return showToast("ليس دورك!");

            if(color === 'black') {
                pendingCardPlay = { type: 'play_card', playerId: myId, cardId: id };
                document.getElementById('modal-color').classList.add('active');
            } else if (val === '7') {
                pendingCardPlay = { type: 'play_card', playerId: myId, cardId: id };
                showPlayerSelectModal();
            } else {
                sendAction({ type: 'play_card', playerId: myId, cardId: id });
            }
        }

        function resolveColor(col) {
            document.getElementById('modal-color').classList.remove('active');
            if(pendingCardPlay) {
                pendingCardPlay.selectedColor = col;
                sendAction(pendingCardPlay);
                pendingCardPlay = null;
            }
        }

        function showPlayerSelectModal() {
            let html = '';
            gameState.players.forEach(p => {
                if(p.id !== myId && !p.eliminated) {
                    html += `<button class="btn-duo" style="background:var(--surface); border-color:var(--black);" onclick="resolvePlayer7('${p.id}')">${p.name} (${p.hand.length} ورقة)</button>`;
                }
            });
            document.getElementById('player-select-list').innerHTML = html;
            document.getElementById('modal-player-select').classList.add('active');
        }

        function resolvePlayer7(targetId) {
            document.getElementById('modal-player-select').classList.remove('active');
            if(pendingCardPlay) {
                pendingCardPlay.targetId = targetId;
                sendAction(pendingCardPlay);
                pendingCardPlay = null;
            }
        }

        function drawCard() {
            let isMyTurn = (gameState.players[gameState.turnIdx].id === myId);
            if(!isMyTurn) return showToast("ليس دورك!");
            sendAction({ type: 'draw_card', playerId: myId });
        }

        function callUno() {
            showToast("قلت أونو!");
        }
    </script>
</body>
</html>
